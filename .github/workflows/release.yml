name: Release

env:
  BUILD_NAME: "stalwart"
  BUILD_REPO: "stalwartlabs/stalwart"
  BUILD_CHECKOUT: "v0.16.18"
  BUILD_VERSION: "2026.08.18"
  BUILD_COMMIT: "d08305df2e865ccf8b0676fd63ebd37d25aef787"

  # Preview mode: Publishes the build output as a CI artifact instead of creating
  # a release, allowing for manual inspection of the output. This mode is
  # activated if the CI run was triggered by events other than pushed tags, or
  # if the repository is a fork.
  preview: ${{ !startsWith(github.ref, 'refs/tags/') || github.repository != 'ci-prebuild/stalwart' }}

on:
  push:
    tags:
    - '[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+'
    branches:
    - 'patch/ci-release-*'
    - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build }}
    env:
      # Emit backtraces on panics.
      RUST_BACKTRACE: 1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        build: [amd64, arm64]
        include:
        - build: amd64
          # WARN: When changing this to a newer version, make sure that the GLIBC isnt too new, as this can cause issues
          # with portablity on older systems that dont follow ubuntus more rapid release cadence.
          os: ubuntu-22.04
          #rust: stable
        - build: arm64
          os: ubuntu-22.04-arm
          #rust: stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BUILD_REPO }}
          ref: ${{ env.BUILD_CHECKOUT }}
      - name: Checkout  sources for packaging
        uses: actions/checkout@v7
        with:
          path: "__CI_PREBUILD__"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin the toolchain version explicitly.
          toolchain: stable

      - name: restore cached ${{ matrix.build }} binary
        id: restore
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ matrix.build }}-${{ github.sha }}
          path: |
            target/release/${{ env.BUILD_NAME }}

      - name: Build release binary
        if: steps.restore.outputs.cache-hit != 'true'
        run: cargo build --release -p ${{ env.BUILD_NAME }} --no-default-features --features "sqlite"

      - name: cache compiled stuff 
        uses: actions/cache/save@v6.1.0
        id: cache-binary
        with:
          key: ${{ matrix.build }}-${{ github.sha }}
          path: |
            target/release/${{ env.BUILD_NAME }}

  packaging:
    runs-on: ubuntu-latest
    name: packaging ${{ matrix.build }} binary
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        build: [amd64, arm64]
    needs: build
    steps:

      - name: Checkout  sources for packaging
        uses: actions/checkout@v7
        with:
          path: "__CI_PREBUILD__"

      - name: restore cached ${{ matrix.build }} binary
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ matrix.build }}-${{ github.sha }}
          path: |
            target/release/${{ env.BUILD_NAME }}

      - name: create path __CI_PREBUILD__/debian/usr/local/bin
        run: |
          ls -al
          ls -al target
          ls -al target/release
          mkdir -p __CI_PREBUILD__/debian/usr/local/bin
          cp target/release/${{ env.BUILD_NAME }} __CI_PREBUILD__/debian/usr/local/bin/${{ env.BUILD_NAME }}
    
      - name: Build deb for ${{ matrix.build }}
        uses: jiro4989/build-deb-action@86e86ceb88b13157fa569663d43c89346505fc3e
        with:
          package: ${{ env.BUILD_NAME }}
          package_root: __CI_PREBUILD__/debian
          maintainer: selfhoster1312
          version: ${{ env.BUILD_VERSION }}
          arch: ${{ matrix.build }}
        id: build-deb

      - name: Upload deb to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        if: env.preview == 'false'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-deb.outputs.file_name }}
          tag: ${{ github.ref_name }}
          overwrite: true

      - name: Upload deb as artifact
        uses: actions/upload-artifact@v7
        if: env.preview == 'true'
        with:
          path: ${{ steps.build-deb.outputs.file_name }}
          archive: false
